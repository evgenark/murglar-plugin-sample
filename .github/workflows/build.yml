name: Build plugin

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias plugin -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass pluginpass -keypass pluginpass \
            -dname "CN=localfiles, O=dev, C=RU"

      - name: Copy keystore next to every build.gradle.kts
        run: |
          find . -name build.gradle.kts \
            -execdir cp "$GITHUB_WORKSPACE/release.keystore" ./release.keystore \;
          ls -R | head -50

      - name: Prepare local.properties
        run: |
          cp local.template.properties local.properties
          sed -i \
            -e "s|^sdk.dir=.*|sdk.dir=/usr/local/lib/android/sdk|" \
            -e "s|^storeFile=.*|storeFile=release.keystore|" \
            -e "s|^storePassword=.*|storePassword=pluginpass|" \
            -e "s|^keyAlias=.*|keyAlias=plugin|" \
            -e "s|^keyPassword=.*|keyPassword=pluginpass|" \
            local.properties
          cat local.properties

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean :sample-core:build :sample-android:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plugin-apk
          path: '**/build/outputs/apk/release/*.apk'
